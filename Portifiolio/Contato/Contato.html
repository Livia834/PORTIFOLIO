      <div class="secao-formulario">
            <h2 data-pt="Entre em Contato" data-en="Get in Touch">Entre em Contato</h2>
            <p class="subtitle" data-pt="Sinta-se à vontade para se conectar ou me enviar uma mensagem." data-en="Feel free to connect or send me a message.">Sinta-se à vontade para se conectar ou me enviar uma mensagem.</p>

           <form id="contact-form">
    <div class="input-group">
        <input type="text" name="from_name" placeholder="Seu nome" data-pt-placeholder="Seu nome" data-en-placeholder="Your name" required>
    </div>

    <div class="input-group">
        <input type="email" name="from_email" placeholder="seu@email.com" data-pt-placeholder="seu@email.com" data-en-placeholder="your@email.com" required>
    </div>

    <div class="input-group">
        <textarea name="message" rows="5" placeholder="Sua mensagem..." data-pt-placeholder="Sua mensagem..." data-en-placeholder="Your message..." required></textarea>
    </div>

    <button type="submit" id="button" data-pt="Enviar" data-en="Send">Enviar</button>
</form>
